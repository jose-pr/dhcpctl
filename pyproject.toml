[build-system]
requires = ["hatchling>=1.27"]  # PEP 639 license fields need 1.27
build-backend = "hatchling.build"

[project]
name = "pydhcpctl"
version = "0.1.0"
authors = [{ name = "jose-pr" }]
description = "One interface to DHCP servers: arm a reservation on dnsmasq, Kea, ISC dhcpd or Windows DHCP, then remove or keep it."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    # MACAddress.format/hex and the address/network types every backend reads;
    # 0.4.1 is the floor pydhcp needs.
    "netimps>=0.4.1,<0.5",
    # What is served: DHCPLease with its BOOTP boot fields and no-address form,
    # DHCPOptions and its mapping form, OptionCodeEnum and resolve(), and the
    # codecs that check each value and give netsh its data types (0.9.0).
    "pydhcp>=0.9.0,<0.10",
    # dnsmasq's hosts/opts paths, local or a URI; the 0.1 series is the first
    # with the `uripath` import name, and hostctl 0.4 needs 0.1.2.
    "pathapi>=0.1.2,<0.2",
    "pathapi-uri>=0.1.0,<0.2",
    # The shell a backend runs commands in: local, ssh or WinRM. Its core
    # needs only pathapi and netimps; each remote transport is an extra.
    "hostctl>=0.4.0,<0.5",
]

[project.optional-dependencies]
# One extra per backend dependency; each is imported only when a URI needs it.
# dnsmasq needs nothing for a local server, and windhcp nothing locally.
# 2.32.3: hostctl[winrm] needs it, so the floors resolve together.
kea = ["requests>=2.32.3,<3"]                  # kea:// and keas://
dhcpd = ["pypureomapi>=0.8,<2"]                # dhcpd:// over OMAPI
winrm = ["hostctl[winrm]>=0.4.0,<0.5"]         # windhcp://...?transport=winrm
# windhcp over ssh, and a remote dnsmasq: its sftp:// paths and its reload.
ssh = ["hostctl[ssh]>=0.4.0,<0.5", "sftppath[uri]>=0.1.3,<0.2"]
# The `dhcpctl` command line; importing dhcpctl never needs it.
cli = ["duho>=0.7.8,<0.8"]
# Reservation.to_text/from_text as YAML, TOML or INI; JSON needs nothing.
formats = ["pydhcp[pktcap]", "pktcap[yaml,toml]>=0.1.1,<0.2"]
dev = [
    # Every extra, so their tests run rather than skip.
    "pydhcpctl[cli,kea,dhcpd,winrm,ssh,formats]",
    "black",
    "build",
    "pytest",
]
docs = [
    # MkDocs 2 drops the plugin system mkdocstrings needs.
    "mkdocs<2",
    "mkdocs-material",
    "mkdocstrings[python]",
    # 12.2 made Highlight(md) required; mkdocstrings 1.0.6 (the newest on 3.10) omits it.
    "pymdown-extensions<12.2; python_version < '3.11'",
]

[project.scripts]
dhcpctl = "dhcpctl.cli:main"

[project.urls]
Homepage = "https://github.com/jose-pr/dhcpctl/"
Documentation = "https://jose-pr.github.io/dhcpctl/"
Issues = "https://github.com/jose-pr/dhcpctl/issues"

# Personal overrides (`*.local.*`) and agent config (`CLAUDE*`) never ship, even
# from a tree without its .gitignore. Neither does the repo-root AGENTS.md: it
# orients a contributor in a checkout. The API header an installed consumer
# reads is src/dhcpctl/AGENTS.md, which does ship.
[tool.hatch.build.targets.sdist]
exclude = ["/.*", "/AGENTS.md", "*.local.*", "CLAUDE*"]

[tool.hatch.build.targets.wheel]
packages = ["src/dhcpctl"]
exclude = ["*.local.*", "CLAUDE*"]

[tool.black]
target-version = ["py39"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["error"]
